services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ncr
      POSTGRES_PASSWORD: ncr
      POSTGRES_DB: ncr_homes
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncr -d ncr_homes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for listing media. The official minio/minio
  # images are no longer pullable, so RustFS is used; the API only needs S3.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minio-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - s3data:/data

  # One-shot: creates the media bucket and allows anonymous reads (public images).
  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minio}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minio-secret}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${S3_BUCKET:-ncr-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api head-bucket --bucket $$BUCKET 2>/dev/null && break
          aws --endpoint-url http://storage:9000 s3api create-bucket --bucket $$BUCKET 2>/dev/null && break
          sleep 2
        done
        aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket $$BUCKET --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/*\"]}]}"
        echo "bucket $$BUCKET ready"
    restart: "no"

  # Local SMTP sink: set SMTP_HOST=localhost SMTP_PORT=1025, UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  s3data:
